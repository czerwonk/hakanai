name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'helm/**'
  workflow_dispatch:

jobs:
  release:
    uses: czerwonk/rust-ci/.github/workflows/helm-release.yml@v1
    secrets: inherit
    with:
      chart-path: helm/hakanai
      pages-url: https://czerwonk.github.io/hakanai
      dependency-repos: '{"bitnami": "https://charts.bitnami.com/bitnami"}'
