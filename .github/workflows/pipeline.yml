name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

jobs:
  # Build TypeScript and WASM assets once for the entire pipeline, then run the TypeScript tests
  assets:
    uses: czerwonk/rust-ci/.github/workflows/assets.yml@v2
    with:
      node-version: "26"
      package-dir: typescript
      wasm: true
      wasm-pack-version: "v0.14.0"
      build-command: make build-ts
      artifact-path: server/includes/
      artifact-files: |
        server/includes/*.js
        server/includes/*.wasm
        server/includes/*.min.css
      test-command: cd typescript/tests && npm test

  ci:
    needs: assets
    uses: czerwonk/rust-ci/.github/workflows/ci.yml@v2
    with:
      artifact-name: ${{ needs.assets.outputs.artifact-name }}
      artifact-path: server/includes/
      env: '{"SKIP_ASSET_BUILD": "1"}'

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [assets, ci]
    uses: czerwonk/rust-ci/.github/workflows/docker.yml@v2
    secrets: inherit
    with:
      artifact-name: ${{ needs.assets.outputs.artifact-name }}
      artifact-path: server/includes/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [assets, ci]
    uses: czerwonk/rust-ci/.github/workflows/release.yml@v2
    secrets: inherit
    with:
      bin-name: hakanai
      artifact-name: ${{ needs.assets.outputs.artifact-name }}
      artifact-path: server/includes/
      env: '{"SKIP_ASSET_BUILD": "1"}'
      matrix: |
        [
          {"release_for": "macOS-x86_64", "os": "macOS-latest", "target": "x86_64-apple-darwin"},
          {"release_for": "macOS-aarch64", "os": "macOS-latest", "target": "aarch64-apple-darwin"},
          {"release_for": "Linux-x86_64", "os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"}
        ]

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [assets, ci]
    uses: czerwonk/rust-ci/.github/workflows/publish.yml@v2
    secrets: inherit
    with:
      packages: '["hakanai-lib", "hakanai"]'
      version-manifest: lib/Cargo.toml
