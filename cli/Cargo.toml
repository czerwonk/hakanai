# SPDX-License-Identifier: Apache-2.0

[package]
name = "hakanai"
version = "3.1.1"
edition = "2024"
license = "Apache-2.0"
description = "CLI client for Hakanai, a secure secret sharing service."
readme = "../README.md"
repository = "https://github.com/czerwonk/hakanai"
keywords = ["encryption", "secret", "sharing", "zero-knowledge", "privacy"]
categories = ["cryptography", "security", "command-line-utilities"]

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
clap = { version = "4.6.10", features = ["derive", "env"] }
colored = "3.1.1"
hakanai-lib = { workspace = true, features = ["testing"] }
humantime = "2.4.0"
indicatif = "0.18.6"
ipnet = { version = "2.12.2", features = ["serde"] }
qrcode = "0.15"
reqwest = { version = "0.13.5", features = ["json"] }
rpassword = "7.5.5"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.9"
zeroize = "1.9.2"
zip = "9.8.2"

[dev-dependencies]
tempfile = "3.27.0"
